# Synthetic unit tests only. No broker credentials, trading command, archive
# upload, cloud execution schedule or private state repository access.
name: PAPER software offline validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paper-offline-validation
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_TERMINAL_PROMPT: '0'
      GIT_LFS_SKIP_SMUDGE: '1'
      LOCALAPPDATA: ${{ runner.temp }}/paper-offline-tests
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Run synthetic tests
        run: python -m unittest discover -s tests -v
