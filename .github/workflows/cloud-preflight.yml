name: PAPER cloud read-only preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zoh-main-paper
  cancel-in-progress: false

jobs:
  preflight:
    if: github.repository == 'metrobasicsusa-wq/zero-or-hero-codex-paper' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Verify PAPER account and private state access without trading
        env:
          ZOH_MAIN_PAPER_KEY: ${{ secrets.ZOH_MAIN_PAPER_KEY }}
          ZOH_MAIN_PAPER_SECRET: ${{ secrets.ZOH_MAIN_PAPER_SECRET }}
          ZOH_STATE_GITHUB_TOKEN: ${{ secrets.ZOH_STATE_GITHUB_TOKEN }}
          ZOH_EXPECTED_ACCOUNT_SHA256: ${{ secrets.ZOH_EXPECTED_ACCOUNT_SHA256 }}
        run: python run_cloud_preflight.py
