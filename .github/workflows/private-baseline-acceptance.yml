# Manual read-only acceptance. This source template is inactive until explicitly
# published to the separate public code repository's .github/workflows directory.
# No broker secrets, trading, cutover, private-data artifacts, cache or uploads.
name: Private baseline cold restore acceptance

on:
  workflow_dispatch:
    inputs:
      baseline_commit:
        description: Reviewed offline-validation HEAD containing source-manifest.json
        required: true
        type: string
      source_manifest_sha256:
        description: Reviewed native snapshot manifest SHA256
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: zoh-private-baseline-acceptance
  cancel-in-progress: false

jobs:
  cold-restore:
    if: github.repository == 'metrobasicsusa-wq/zero-or-hero-codex-paper' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_TERMINAL_PROMPT: '0'
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - name: Check out reviewed code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Restore and verify private offline baseline without trading
        env:
          TMPDIR: ${{ runner.temp }}
          ZOH_STATE_GITHUB_TOKEN: ${{ secrets.ZOH_STATE_GITHUB_TOKEN }}
          ZOH_EXPECTED_ACCOUNT_SHA256: ${{ secrets.ZOH_EXPECTED_ACCOUNT_SHA256 }}
          ZOH_BASELINE_COMMIT: ${{ inputs.baseline_commit }}
          ZOH_SOURCE_MANIFEST_SHA256: ${{ inputs.source_manifest_sha256 }}
        run: python cloud-main/verify_private_baseline.py
